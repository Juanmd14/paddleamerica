<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      font-family: Arial, Helvetica, sans-serif;
      color: #0a101e;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f7f9fc; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e4eaf2;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background: #0a101e; padding: 24px 32px">
                <span
                  style="
                    font-size: 22px;
                    font-weight: bold;
                    letter-spacing: 1px;
                    color: #ffffff;
                  "
                  >PADDLE<span style="color: #ffbb1f">AMERICA</span></span
                ><br />
                <span
                  style="font-size: 10px; letter-spacing: 3px; color: #9fb0c9"
                  >AMÉRICA · RIVADAVIA</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3">
                  Confirmá tu cuenta
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #2c3b56;
                  "
                >
                  Gracias por sumarte. Tocá el botón para confirmar tu email y
                  empezar a anotarte en los torneos.
                </p>
                <a
                  href="{{ if eq .RedirectTo .SiteURL }}{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email{{ else }}{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email{{ end }}"
                  style="
                    display: inline-block;
                    background: #ffbb1f;
                    color: #0a101e;
                    text-decoration: none;
                    font-weight: bold;
                    font-size: 15px;
                    padding: 14px 28px;
                    border-radius: 999px;
                  "
                >
                  Confirmar mi cuenta
                </a>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #50668a;
                  "
                >
                  El link vence en una hora. Si no creaste una cuenta en
                  PaddleAmerica, ignorá este mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
